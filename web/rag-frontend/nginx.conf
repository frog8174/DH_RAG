server {
    listen 80;
    server_name localhost;
    
    # ... (原本的 root 和 index 設定) ...
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    # 1. 靜態網頁 (SPA) 設定
    location /RAG-UI/ {
        try_files $uri $uri/ /RAG-UI/index.html;
    }

    # 2. ✅ [新增] API 反向代理設定
    location /api/ {
        # 設定逾時時間為 300 秒 (5分鐘)，避免 AI 生成過久導致 504 Gateway Timeout
        proxy_read_timeout 1000s;
        proxy_connect_timeout 1000s;
        proxy_send_timeout 1000s;

        # 這一行是核心：把請求轉發給後端伺服器
        # 注意：結尾的 /api/ 很重要，這代表把路徑對應過去
        proxy_pass http://bgem3-backend.toolmen.bime.ntu.edu.tw/api/;

        # 設定 Host Header，有些後端會檢查這個
        proxy_set_header Host bgem3-backend.toolmen.bime.ntu.edu.tw;

        # 傳遞使用者的真實 IP 給後端 (雖然這邊是內網，但加著是好習慣)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 移除 CORS 限制 (因為現在是 Nginx 對 Nginx，瀏覽器不會擋)
        # 如果後端已經有設 CORS，這幾行可以不用，但為了保險可以加上
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin;
    }
}