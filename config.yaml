google:
  api_key: "${GOOGLE_API_KEY}" # 可從 .env 讀取
  model: "gemini-2.5-flash" # 可選: gemini-2.0-flash | gemini-2.5-flash | gemini-2.0-pro
  temperature: 0
  max_tokens: null
  timeout: null
  thinking_budget: 200
  include_thoughts: true
  response_mime_type: "application/json"
  json_schema:
    type: object
    properties:
      題幹:
        type: string
        description: "一題單選題的題目敘述，不含選項文字。"
      選項A:
        type: string
        description: "選項 A 的完整文字，包含 '(A)' 開頭"
      選項B:
        type: string
        description: "選項 B 的完整文字，包含 '(B)' 開頭"
      選項C:
        type: string
        description: "選項 C 的完整文字，包含 '(C)' 開頭"
      選項D:
        type: string
        description: "選項 D 的完整文字，包含 '(D)' 開頭"
      正確答案:
        type: string
        description: "正確選項的代號，只能是 (A)、(B)、(C) 或 (D) 其一。"
        pattern: "^\\(?[A-D]\\)?$"
      解析:
        type: string
        description: "說明為什麼正確答案是該選項，可包含解題步驟與概念說明。"

    required: ["題幹", "選項A", "選項B", "選項C", "選項D", "正確答案"]

milvus:
  mode: "hybrid"  # 可選: semantic | bm25 | hybrid (語意/全文/混合)
  connection_args:
    uri: "./milvus_history.db"
  collection_name: "textbook_teacher"

  semantic:
    text_field: "text"
    vector_field: "dense"
    index_params:
      field_name: "dense"
      index_type: "FLAT"
      metric_type: "IP"

  bm25:
    text_field: "text"
    vector_field: "sparse"
    builtin_function:
      input_field_names: "text"
      output_field_names: "sparse"
      analyzer_params:
        type: "chinese"
      enable_match: true
    index_params:
      - field_name: "sparse"
        index_name: "sparse_inverted_index"
        index_type: "SPARSE_WAND"
        metric_type: "BM25"

  hybrid:
    text_field: "text"
    vector_field: ["dense", "sparse"]
    builtin_function:
      input_field_names: "text"
      output_field_names: "sparse"
      analyzer_params:
        type: "chinese"
      enable_match: true
    index_params:
      - field_name: "dense"
        index_type: "FLAT"
        metric_type: "IP"
      - field_name: "sparse"
        index_name: "sparse_inverted_index"
        index_type: "SPARSE_WAND"
        metric_type: "BM25"

retriever:
  search_kwargs:
    k: 5

prompt:
  question_generation: |
    你是一名歷史考題的出題助手，請依照"題目部分敘述"以及"補充資料"，出一題有深度的、含有4個選項(A、B、C、D)的**單選題**：

    <question>
    {question}
    </question>

    <context>
    {context}
    </context>

    Output: